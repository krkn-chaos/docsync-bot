name: Trigger docs sync

# When a scenario's env.sh or krknctl-input.json lands on main, tell the website's
# Doc Sync workflow to regenerate that scenario's docs. Uses a GitHub App token
# scoped to website_2 (handover-friendly: no personal PAT).
#
# push, not pull_request: a PR from a fork gets no repository secrets.

on:
  push:
    branches: [main]
    paths:
      - env.sh
      - '*/env.sh'
      - '*/krknctl-input.json'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Find the changed scenarios
        id: scenario
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Branch created, nothing to compare against."
            exit 0
          fi
          files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
          # A single push can touch several scenarios; sync every one, not just the first.
          scenarios=$(echo "$files" | grep -E '^[^/]+/(env\.sh|krknctl-input\.json)$' \
            | cut -d/ -f1 | sort -u | tr '\n' ' ')
          # The root env.sh holds the krkn-hub global params, generated under the
          # "globals" scenario rather than from a directory.
          if echo "$files" | grep -qx 'env\.sh'; then
            scenarios="globals $scenarios"
          fi
          scenarios=$(echo $scenarios | tr -s ' ')
          if [ -n "$scenarios" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "names=$scenarios" >> "$GITHUB_OUTPUT"
            echo "Changed: $scenarios"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No env.sh / krknctl-input.json changed; skipping."
          fi

      - name: Mint a website_2-scoped app token
        if: steps.scenario.outputs.relevant == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: StrikerEureka34
          repositories: website_2

      - name: Dispatch doc-sync on the website
        if: steps.scenario.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # One dispatch carrying every changed scenario; the bot opens a single PR.
          gh workflow run doc-sync.lock.yml \
            --repo StrikerEureka34/website_2 \
            -f scenarios="${{ steps.scenario.outputs.names }}"
