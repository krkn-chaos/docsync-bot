name: Trigger docs sync

# The CRDs under config/crd/bases own the operator's API surface. When one lands
# on main, tell the website's Doc Sync workflow to regenerate the api-reference
# tables. Uses a GitHub App token scoped to the website, no PAT.
#
# push, not pull_request: a PR from a fork gets no repository secrets.

on:
  push:
    branches: [main]
    paths:
      - config/crd/bases/**

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a website-scoped app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOC_SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.DOC_SYNC_BOT_APP_PRIVATE_KEY }}
          owner: krkn-chaos
          repositories: website

      - name: Dispatch doc-sync on the website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # One target for all 9 kinds: they live in one directory and
          # regenerating all of them costs nothing.
          gh workflow run doc-sync.lock.yml \
            --repo krkn-chaos/website \
            -f scenarios="operator"
